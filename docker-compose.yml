# RankForge Production Docker Compose
# Usage: docker compose up -d
# Supports both cloud and self-hosted modes

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rankforge}
      POSTGRES_USER: ${POSTGRES_USER:-rankforge}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-rankforge_password_change_in_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/api/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rankforge} -d ${POSTGRES_DB:-rankforge}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis (for caching and job queue - optional, only if needed)
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password_change}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    profiles: ["with-redis"]

  # API Server
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-rankforge}:${DATABASE_PASSWORD:-rankforge_password_change_in_production}@postgres:5432/${POSTGRES_DB:-rankforge}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password_change}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-your-jwt-secret-min-32-chars-change-in-production}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-your-encryption-key-32-chars-min}
      APP_URL: ${APP_URL:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      DATAFORSEO_LOGIN: ${DATAFORSEO_LOGIN:-}
      DATAFORSEO_PASSWORD: ${DATAFORSEO_PASSWORD:-}
      SERPAPI_KEY: ${SERPAPI_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      PAGESPEED_API_KEY: ${PAGESPEED_API_KEY:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-rankforge-storage}
      S3_REGION: ${S3_REGION:-us-east-1}
      SENTRY_DSN: ${SENTRY_DSN:-}
      POSTHOG_KEY: ${POSTHOG_KEY:-}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
      CRAWLER_MAX_CONCURRENCY: ${CRAWLER_MAX_CONCURRENCY:-10}
      CRAWLER_USER_AGENT: ${CRAWLER_USER_AGENT:-RankForge/1.0}
    ports:
      - "${API_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/v1/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Background Worker
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-rankforge}:${DATABASE_PASSWORD:-rankforge_password_change_in_production}@postgres:5432/${POSTGRES_DB:-rankforge}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password_change}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-your-jwt-secret-min-32-chars-change-in-production}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-your-encryption-key-32-chars-min}
      DATAFORSEO_LOGIN: ${DATAFORSEO_LOGIN:-}
      DATAFORSEO_PASSWORD: ${DATAFORSEO_PASSWORD:-}
      SERPAPI_KEY: ${SERPAPI_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-rankforge-storage}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
      WORKER_TIMEOUT: ${WORKER_TIMEOUT:-300000}
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  # MCP Server
  mcp:
    build:
      context: .
      dockerfile: apps/mcp/Dockerfile
    environment:
      NODE_ENV: production
      MCP_PORT: 3002
      DATABASE_URL: postgresql://${POSTGRES_USER:-rankforge}:${DATABASE_PASSWORD:-rankforge_password_change_in_production}@postgres:5432/${POSTGRES_DB:-rankforge}
      JWT_SECRET: ${JWT_SECRET:-your-jwt-secret-min-32-chars-change-in-production}
      DATAFORSEO_LOGIN: ${DATAFORSEO_LOGIN:-}
      DATAFORSEO_PASSWORD: ${DATAFORSEO_PASSWORD:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "${MCP_PORT:-3002}:3002"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["with-mcp"]

  # Web Frontend
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3001/api}
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
