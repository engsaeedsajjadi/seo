<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="language" content="fa" />
    <meta name="description" content="رنک‌فورج — پلتفرم جامع اتوماسیون سئو برای کسب‌وکارها" />
    <title>رنک‌فورج — پلتفرم اتوماسیون سئو</title>
    <!-- Vazirmatn font for Persian - optimized loading -->
    <style>
      /* Vazirmatn as primary font for Persian */
      :root {
        --font-persian: 'Vazirmatn', 'IRANSans', 'Tahoma', system-ui, -apple-system, sans-serif;
        --font-latin: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        font-family: var(--font-persian);
        /* RTL base */
        direction: rtl;
        text-align: right;
      }
      
      /* Ensure Vazirmatn loads with proper fallbacks */
      body {
        font-feature-settings: 'ss01' 1;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      
      /* Persian number styling */
      .persian-numbers {
        font-variant-numeric: normal;
        font-feature-settings: 'ss01' 1;
      }
      
      html.light,
      html.light body {
        background-color: #ffffff !important;
        color: #000000;
      }
      html.dark,
      html.dark body {
        background-color: #0f172a !important;
        color: #ffffff;
      }
      
      /* RTL scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      
      /* Loading state with Persian text */
      #root:empty::before {
        content: 'در حال بارگذاری رنک‌فورج...';
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        font-family: var(--font-persian);
        color: #94a3b8;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="/boot.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
