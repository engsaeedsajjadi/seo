<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="language" content="fa" />
    <meta name="description" content="رنک‌فورج — پلتفرم جامع اتوماسیون سئو برای کسب‌وکارها" />
    <title>رنک‌فورج — پلتفرم اتوماسیون سئو</title>
    <!-- Vazirmatn font for Persian - optimized loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      /* Vazirmatn as primary font for Persian */
      :root {
        --font-persian: 'Vazirmatn', 'IRANSans', 'Tahoma', system-ui, -apple-system, sans-serif;
        --font-latin: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        font-family: var(--font-persian);
        /* RTL base */
        direction: rtl;
        text-align: right;
      }
      
      /* Ensure Vazirmatn loads with proper fallbacks */
      body {
        font-feature-settings: 'ss01' 1;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      
      /* Persian number styling */
      .persian-numbers {
        font-variant-numeric: normal;
        font-feature-settings: 'ss01' 1;
      }
      
      html.light,
      html.light body {
        background-color: #ffffff !important;
        color: #000000;
      }
      html.dark,
      html.dark body {
        background-color: #0f172a !important;
        color: #ffffff;
      }
      
      /* RTL scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      
      /* Loading state with Persian text */
      #root:empty::before {
        content: 'در حال بارگذاری رنک‌فورج...';
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        font-family: var(--font-persian);
        color: #94a3b8;
        font-size: 14px;
      }
    </style>
    <script>
      // Set Persian as default, RTL direction
      (function () {
        const isInIframe = window.self !== window.top;

        function applyThemeToDOM(theme) {
          document.documentElement.classList.remove("light", "dark");
          document.documentElement.classList.add(theme);
          document.documentElement.setAttribute("data-theme", theme);
          // Ensure RTL and Persian lang are set
          document.documentElement.setAttribute("lang", "fa");
          document.documentElement.setAttribute("dir", "rtl");
        }

        if (isInIframe) {
          window.addEventListener("message", function (event) {
            if (event.data && typeof event.data.theme === "string") {
              const theme = event.data.theme;
              if (theme === "light" || theme === "dark") {
                applyThemeToDOM(theme);
              }
            }
          });
        } else {
          // Default dark theme for RankForge
          applyThemeToDOM("dark");
        }
        
        // Always ensure RTL
        document.documentElement.setAttribute("lang", "fa");
        document.documentElement.setAttribute("dir", "rtl");
      })();
    </script>
    <script>
      (function () {
        if (window.self === window.top) return;
        var reported = {};
        window.addEventListener("error", function (event) {
          if (!event || !event.message) return;
          var key =
            event.message + "|" + (event.filename || "") + "|" + (event.lineno || 0);
          if (reported[key]) return;
          reported[key] = true;
          try {
            window.parent.postMessage(
              {
                type: "sandbox-runtime-error",
                payload: {
                  message: String(event.message).slice(0, 500),
                  filename: event.filename || "",
                  lineno: event.lineno || 0,
                  colno: event.colno || 0,
                  stack:
                    event.error && event.error.stack
                      ? String(event.error.stack).slice(0, 2000)
                      : ""
                }
              },
              "*"
            );
          } catch (e) {
            /* ignore */
          }
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
