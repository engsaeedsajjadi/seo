name: CI/CD Pipeline

on:
  push:
    branches: [main, production-ready-seo-saas-aca82, arena/01a0ab8c-seo]
  pull_request:
    branches: [main, production-ready-seo-saas-aca82, arena/01a0ab8c-seo]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/

  api:
    name: API Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
        working-directory: apps/api
      - run: npm run build
        working-directory: apps/api

  worker:
    name: Worker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/worker/package-lock.json
      - name: Install API dependencies used by shared worker modules
        run: npm ci
        working-directory: apps/api
      - name: Build API shared modules
        run: npm run build
        working-directory: apps/api
      - run: npm ci
        working-directory: apps/worker
      - run: npm run build
        working-directory: apps/worker

  mcp:
    name: MCP Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/mcp/package-lock.json
      - run: npm ci
        working-directory: apps/mcp
      - run: npm run build
        working-directory: apps/mcp

  integration:
    name: Integration & Database Security Tests
    runs-on: ubuntu-latest
    needs: [api, worker, mcp]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: rankforge
          POSTGRES_PASSWORD: rankforge
          POSTGRES_DB: rankforge_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rankforge -d rankforge_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://rankforge:rankforge@localhost:5432/rankforge_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint -- --max-warnings=0
      - run: npm run db:migrate
        working-directory: apps/api
      - name: Create non-owner RLS test role
        run: |
          PGPASSWORD=rankforge psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE rankforge_app LOGIN PASSWORD 'rankforge_app'" || true
          PGPASSWORD=rankforge psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "GRANT USAGE ON SCHEMA public TO rankforge_app; GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO rankforge_app; GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO rankforge_app;"
      - name: Verify PostgreSQL RLS with non-owner role
        run: PGPASSWORD=rankforge_app psql "postgresql://rankforge_app:rankforge_app@localhost:5432/rankforge_test" -v ON_ERROR_STOP=1 -f tests/security/rls-postgres.sql
      - run: npm run test

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [frontend, api, worker, mcp, integration]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t rankforge-web:${{ github.sha }} .
      - run: docker build -t rankforge-api:${{ github.sha }} apps/api/
      - run: docker build -t rankforge-worker:${{ github.sha }} apps/worker/
      - run: docker build -t rankforge-mcp:${{ github.sha }} apps/mcp/

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified
